services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dasi}
      POSTGRES_USER: ${POSTGRES_USER:-dasi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    volumes:
      # PostgreSQL 18 usa /var/lib/postgresql como volumen persistente.
      - dasi_pgdata:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL en .env}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Defina FIREBASE_PROJECT_ID en .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://dasi.uroosevelt.edu.pe}
      IMPORTAR_DATOS: ${IMPORTAR_DATOS:-true}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    networks:
      internal:
      proxy:
        aliases:
          - dasi-web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  internal:
    driver: bridge
  proxy:
    external: true
    name: ur_apps_proxy

volumes:
  dasi_pgdata:
