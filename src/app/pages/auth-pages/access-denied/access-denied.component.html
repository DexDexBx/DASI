<div class="relative flex flex-col items-center justify-center min-h-screen p-6 overflow-hidden z-1">
  <app-grid-shape />

  <div class="mx-auto w-full max-w-[242px] text-center sm:max-w-[520px]">
    <div class="mx-auto mb-8 flex size-20 items-center justify-center rounded-full bg-error-50 dark:bg-error-500/15">
      <svg class="stroke-error-500 dark:stroke-error-400" width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3 4.5 6v5.5c0 4.5 3 8.6 7.5 9.5 4.5-.9 7.5-5 7.5-9.5V6L12 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
        <path d="M12 11v4M12 8h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
    </div>

    <h1 class="mb-3 font-bold text-gray-800 text-title-md dark:text-white/90 xl:text-title-2xl">
      Acceso no autorizado
    </h1>

    <p class="mb-6 text-base text-gray-700 dark:text-gray-400 sm:text-lg">
      {{ message }}
    </p>

<div class="flex flex-col items-center justify-center gap-3 sm:flex-row">
      <a routerLink="/signin"
        class="inline-flex items-center justify-center rounded-lg border border-gray-300 bg-white px-5 py-3.5 text-sm font-medium text-gray-700 shadow-theme-xs hover:bg-gray-50 hover:text-gray-800 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-white/[0.03] dark:hover:text-gray-200">
        Intentar con otra cuenta
      </a>
      <button (click)="requestAccess()"
        class="inline-flex items-center justify-center rounded-lg bg-brand-500 px-5 py-3.5 text-sm font-medium text-white shadow-theme-xs hover:bg-brand-600">
        Solicitar acceso
      </button>
    </div>

    @if (requested) {
      <div class="mt-6 flex items-center justify-center gap-2 rounded-xl border border-success-200 bg-success-50 px-4 py-3 text-sm text-success-600 dark:border-success-500/20 dark:bg-success-500/10 dark:text-success-400">
        <svg class="shrink-0 fill-current" width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M16.7045 4.6415C16.4116 4.34861 15.9367 4.34861 15.6438 4.6415L8.44566 11.8396L5.21444 8.60838C4.92155 8.31549 4.44668 8.31549 4.15379 8.60838C3.8609 8.90127 3.8609 9.37614 4.15379 9.66903L7.94065 13.4559C8.23354 13.7488 8.70841 13.7488 9.0013 13.4559L16.7045 5.75271C16.9974 5.45982 16.9974 4.98495 16.7045 4.6415Z" fill="" />
        </svg>
        Solicitud enviada. El administrador DASI revisará el acceso (simulación).
      </div>
    }
  </div>

  <p class="absolute text-sm text-center text-gray-500 -translate-x-1/2 bottom-6 left-1/2 dark:text-gray-400">
    &copy; {{ currentYear }} - DASI V.01
  </p>
</div>
