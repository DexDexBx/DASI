<div class="relative p-6 bg-white z-1 dark:bg-gray-900 sm:p-0">
  <div
    class="relative flex flex-col justify-center w-full h-screen lg:flex-row dark:bg-gray-900 sm:p-0"
  >
    <div class="flex flex-1 flex-col">
      <ng-content></ng-content>
    </div>
    <div
      class="items-center hidden w-full h-full overflow-hidden lg:w-1/2 relative bg-[#910048] lg:grid"
    >
      <div class="relative z-10 flex items-center justify-center">
        <div class="flex flex-col items-center max-w-sm text-center">
          <a routerLink="/" class="relative block mb-7">
            <div
              class="pointer-events-none absolute inset-0 -z-1 rounded-full bg-white/20 blur-3xl animate-glow-pulse"
            ></div>
            <img
              width="224"
              height="70"
              src="/images/logo/Logo02.png"
              alt="Logo"
            />
          </a>
          <p
            class="mb-3 text-theme-xs font-semibold uppercase tracking-[0.2em] text-white/60"
          >
            Acceso institucional
          </p>
          <h2
            class="mb-3 text-xl font-semibold leading-snug text-white/95"
          >
            Digitalización, Administración y Seguimiento Institucional
          </h2>
          <p class="text-sm leading-relaxed text-white/70">
            Inicia sesión con tu cuenta institucional para administrar y
            dar seguimiento a la información de la institución.
          </p>
        </div>
      </div>

      <!-- Animated soft glows -->
      <div
        class="pointer-events-none absolute -top-20 -right-20 size-72 rounded-full bg-white/10 blur-3xl animate-blob"
      ></div>
      <div
        class="pointer-events-none absolute -bottom-24 -left-16 size-80 rounded-full bg-black/25 blur-3xl animate-blob-delayed"
      ></div>
      <div
        class="pointer-events-none absolute top-1/3 left-10 size-24 rounded-full bg-white/10 blur-2xl animate-blob-slow"
      ></div>
      <div
        class="pointer-events-none absolute bottom-1/4 right-1/4 size-40 rounded-full bg-white/5 blur-2xl animate-blob-delayed"
      ></div>

      <!-- Floating particles -->
      <div class="pointer-events-none absolute inset-0">
        <span class="dasi-particle" style="left: 8%; animation-duration: 14s; animation-delay: 0s"></span>
        <span class="dasi-particle" style="left: 16%; width: 5px; height: 5px; animation-duration: 11s; animation-delay: 3s"></span>
        <span class="dasi-particle" style="left: 27%; width: 9px; height: 9px; animation-duration: 16s; animation-delay: 1.5s"></span>
        <span class="dasi-particle" style="left: 38%; animation-duration: 12s; animation-delay: 5s"></span>
        <span class="dasi-particle" style="left: 46%; width: 5px; height: 5px; animation-duration: 15s; animation-delay: 2s"></span>
        <span class="dasi-particle" style="left: 55%; width: 8px; height: 8px; animation-duration: 13s; animation-delay: 0.8s"></span>
        <span class="dasi-particle" style="left: 64%; animation-duration: 17s; animation-delay: 4s"></span>
        <span class="dasi-particle" style="left: 73%; width: 6px; height: 6px; animation-duration: 12s; animation-delay: 2.8s"></span>
        <span class="dasi-particle" style="left: 81%; width: 9px; height: 9px; animation-duration: 15s; animation-delay: 1s"></span>
        <span class="dasi-particle" style="left: 88%; width: 5px; height: 5px; animation-duration: 14s; animation-delay: 3.6s"></span>
        <span class="dasi-particle" style="left: 94%; animation-duration: 10s; animation-delay: 0.4s"></span>
        <span class="dasi-particle" style="left: 50%; width: 6px; height: 6px; animation-duration: 18s; animation-delay: 6s"></span>
      </div>
    </div>
    <div class="fixed z-50 hidden bottom-6 right-6 sm:block">
      <app-theme-toggle-two />
    </div>
  </div>
</div>
