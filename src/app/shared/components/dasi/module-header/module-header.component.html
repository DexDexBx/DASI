<div class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
  <div>
    <h1 class="text-2xl font-semibold text-gray-800 dark:text-white/90">{{ title }}</h1>
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">{{ description }}</p>
  </div>
  @if (actionLabel) {
    <button (click)="action.emit()" class="inline-flex items-center justify-center rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white shadow-theme-xs hover:bg-brand-600">{{ actionLabel }}</button>
  }
</div>
