<app-modal [isOpen]="isOpen" (close)="close.emit()" className="max-w-[560px] p-6 sm:p-8">
  <h3 class="pr-10 text-xl font-semibold text-gray-800 dark:text-white/90">{{ title }}</h3>
  <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">{{ subtitle }}</p>

  @if (kind === 'actividad') {
    <div class="mt-6 space-y-4">
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Título de la actividad</label>
        <input
          [(ngModel)]="titulo"
          placeholder="Ej. Revisar expediente técnico"
          class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 text-sm text-gray-800 placeholder:text-gray-400 focus:border-brand-500 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-white/90 dark:placeholder:text-gray-500"
        />
      </div>
      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Proyecto</label>
          <select [(ngModel)]="proyectoId" class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-3 text-sm text-gray-700 focus:border-brand-500 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300">
            <option value="">Selecciona un proyecto</option>
            @for (proyecto of proyectos; track proyecto.id) {
              <option [value]="proyecto.id">{{ proyecto.code }} · {{ proyecto.nombre }}</option>
            }
          </select>
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Responsable</label>
          <select [(ngModel)]="responsableId" class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-3 text-sm text-gray-700 focus:border-brand-500 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300">
            <option value="">Selecciona un responsable</option>
            @for (usuario of usuarios; track usuario.id) {
              <option [value]="usuario.id">{{ usuario.nombre }}</option>
            }
          </select>
        </div>
      </div>
      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Prioridad</label>
          <select [(ngModel)]="prioridad" class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-3 text-sm text-gray-700 focus:border-brand-500 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300">
            @for (p of prioridades; track p) {
              <option [value]="p">{{ p }}</option>
            }
          </select>
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Fecha estimada de fin</label>
          <input
            type="datetime-local"
            [(ngModel)]="fechaFin"
            class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-3 text-sm text-gray-700 focus:border-brand-500 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300"
          />
        </div>
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Descripción</label>
        <textarea
          [(ngModel)]="descripcion"
          rows="3"
          placeholder="Detalle de la actividad"
          class="w-full resize-none rounded-lg border border-gray-300 bg-transparent px-4 py-3 text-sm text-gray-800 placeholder:text-gray-400 focus:border-brand-500 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-white/90 dark:placeholder:text-gray-500"
        ></textarea>
      </div>
    </div>
  } @else {
    <div class="mt-6 space-y-4">
      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Nombre completo</label>
          <input
            [(ngModel)]="nombre"
            placeholder="Ej. Juan Pérez"
            class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 text-sm text-gray-800 placeholder:text-gray-400 focus:border-brand-500 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-white/90 dark:placeholder:text-gray-500"
          />
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Iniciales</label>
          <input [value]="initialsPreview" disabled class="h-11 w-full cursor-not-allowed rounded-lg border border-gray-300 bg-gray-100 px-4 text-sm text-gray-500 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400" />
        </div>
      </div>
      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Correo institucional</label>
          <input
            type="email"
            [(ngModel)]="email"
            placeholder="usuario@uroosevelt.edu.pe"
            class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 text-sm text-gray-800 placeholder:text-gray-400 focus:border-brand-500 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-white/90 dark:placeholder:text-gray-500"
          />
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Cuenta</label>
          <input
            [(ngModel)]="account"
            placeholder="jperez"
            class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 text-sm text-gray-800 placeholder:text-gray-400 focus:border-brand-500 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-white/90 dark:placeholder:text-gray-500"
          />
        </div>
      </div>
      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Dependencia</label>
          <select [(ngModel)]="dependenciaId" class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-3 text-sm text-gray-700 focus:border-brand-500 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300">
            <option value="">Sin dependencia</option>
            @for (dep of dependencias; track dep.id) {
              <option [value]="dep.id">{{ dep.nombre }}</option>
            }
          </select>
        </div>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Cargo</label>
          <select [(ngModel)]="cargoId" class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-3 text-sm text-gray-700 focus:border-brand-500 focus:outline-none dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300">
            <option value="">Sin cargo</option>
            @for (cargo of cargos; track cargo.id) {
              <option [value]="cargo.id">{{ cargo.nombre }}</option>
            }
          </select>
        </div>
      </div>
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Roles</label>
        <div class="flex flex-wrap gap-2">
          @for (rol of roles; track rol.id) {
            <button
              type="button"
              (click)="toggleRol(rol.id)"
              class="rounded-full border px-3 py-1.5 text-xs font-medium transition-colors"
              [class.border-brand-500]="isRolSelected(rol.id)"
              [class.bg-brand-50]="isRolSelected(rol.id)"
              [class.text-brand-600]="isRolSelected(rol.id)"
              [class.dark:bg-brand-500/15]="isRolSelected(rol.id)"
              [class.border-gray-300]="!isRolSelected(rol.id)"
              [class.text-gray-600]="!isRolSelected(rol.id)"
              [class.dark:border-gray-700]="!isRolSelected(rol.id)"
              [class.dark:text-gray-300]="!isRolSelected(rol.id)"
            >
              {{ rol.nombre }} · {{ rol.scope }}
            </button>
          } @empty {
            <p class="text-sm text-gray-500 dark:text-gray-400">Sin roles disponibles.</p>
          }
        </div>
      </div>
    </div>
  }

  @if (errorMsg) {
    <p class="mt-4 text-sm text-error-500">{{ errorMsg }}</p>
  }

  <div class="mt-6 flex justify-end gap-3">
    <button (click)="close.emit()" class="rounded-lg border border-gray-300 px-4 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-800">Cancelar</button>
    <button [disabled]="saving" (click)="submit()" class="rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white shadow-theme-xs hover:bg-brand-600 disabled:cursor-not-allowed disabled:opacity-50">
      {{ saving ? 'Guardando…' : (kind === 'usuario' ? 'Crear usuario' : 'Crear actividad') }}
    </button>
  </div>
</app-modal>
